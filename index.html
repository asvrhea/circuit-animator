<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Circuit Animator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1 class="brand">CIRCUIT<span>ANIMATOR</span></h1>
        <div class="topbar-meta" id="meta"></div>
      </header>

      <main class="stage" id="stage">
        <canvas id="view"></canvas>
        <div class="hint" id="hint" hidden></div>
        <div class="toast" id="toast" hidden></div>
        <div class="zoom">
          <button id="z-in" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="z-out" title="Zoom out" aria-label="Zoom out">−</button>
          <button id="z-fit" title="Fit track" aria-label="Fit">FIT</button>
        </div>
        <div class="dropmask" id="dropmask" hidden><span>DROP TO LOAD</span></div>
        <div class="empty" id="empty">
          <p class="empty-title">DROP A CIRCUIT SCREENSHOT</p>
          <p class="empty-sub">or a KML / GPX export, or a saved track JSON</p>
        </div>
      </main>

      <aside class="panel" id="panel">
        <section id="sec-source">
          <h2>Source</h2>
          <label class="drop" id="drop">
            <input type="file" id="file" accept="image/png,image/jpeg,image/webp,.kml,.gpx,.json" hidden />
            <strong>Choose file</strong>
            <span>Screenshot · KML / GPX · track JSON</span>
          </label>
        </section>

        <section id="sec-detect" hidden>
          <h2>Detect</h2>
          <div class="row">
            <button id="btn-pick" class="primary">Pick line colour</button>
            <span id="swatch" class="swatch" title="Picked colour"></span>
          </div>
          <label class="field">
            <span>Tolerance <output id="tol-out">0.20</output></span>
            <input type="range" id="tol" min="0.02" max="0.8" step="0.01" value="0.2" />
          </label>
          <div id="confidence" class="confidence" hidden></div>
          <div class="row">
            <button id="btn-trace">Manual trace</button>
          </div>
          <div class="row" id="trace-tools" hidden>
            <button id="btn-trace-undo">Undo point</button>
            <button id="btn-trace-done" class="primary">Finish</button>
            <button id="btn-trace-cancel">Cancel</button>
          </div>
        </section>

        <section id="sec-track" hidden>
          <h2>Track</h2>
          <p class="help">Drag points · tap the line to add one · right-click or long-press a point to delete</p>
          <div class="grid2">
            <button id="btn-reverse">Reverse</button>
            <button id="btn-start">Set start</button>
            <button id="btn-s2">Place S2</button>
            <button id="btn-s3">Place S3</button>
            <button id="btn-sectors-reset">Equal sectors</button>
            <button id="btn-undo">Undo</button>
          </div>
          <label class="field"><span>Name</span><input id="name" type="text" maxlength="80" /></label>
          <label class="field"><span>Lap length (km)</span><input id="length" type="number" min="0.1" max="100" step="0.001" /></label>
          <div id="stats" class="stats"></div>
        </section>

        <section id="sec-file">
          <h2>File</h2>
          <div class="grid2">
            <button id="btn-save" disabled>Save JSON</button>
            <button id="btn-open">Open…</button>
            <button id="btn-clear">Clear</button>
          </div>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
